services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: boring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boring -d boring"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://boring:${POSTGRES_PASSWORD}@db:5432/boring
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell}
      CORS_ORIGIN: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - bill_uploads:/app/uploads
volumes:
  postgres_data:
  bill_uploads:
