name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boring_test
          POSTGRES_USER: boring
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd 'pg_isready -U boring -d boring_test' --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://boring:ci-only-password@localhost:5432/boring_test
      BB_TEST_DATABASE_URL: postgresql+psycopg://boring:ci-only-password@localhost:5432/boring_test
      JWT_SECRET: ci-only-signing-key-not-for-production-123456
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: pip install -r backend/requirements.txt
      - name: Start demo servers and exercise roles
        env:
          DEMO_MODE: "true"
          JWT_SECRET: ci-demo-only-signing-key-not-for-production-12345
        run: |
          (cd backend && python -m alembic upgrade head && python -m uvicorn app.main:app --port 8000) > /tmp/api.log 2>&1 &
          (cd frontend && npm run dev -- --port 5173) > /tmp/frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npm run test:e2e
      - name: Show server failures
        if: failure()
        run: cat /tmp/api.log /tmp/frontend.log
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
